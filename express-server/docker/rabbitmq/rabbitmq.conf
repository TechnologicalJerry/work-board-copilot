## RabbitMQ Configuration for BoardPilot AI

# Default user/vhost
default_user = boardpilot
default_pass = boardpilot_secret
default_vhost = /

# Networking
listeners.tcp.default = 5672
management.tcp.port = 15672

# Resource limits
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 1.5

# Message TTL defaults
# x-message-ttl = 86400000  # 24 hours in ms

# Max message size (128MB)
max_message_size = 134217728

# Heartbeat
heartbeat = 60

# Connection max
channel_max = 2047

# Logging
log.console = true
log.console.level = info
log.file = false
