global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: 'production'
    application: 'boardpilot-ai'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
    metrics_path: /metrics

  - job_name: 'identity-service'
    static_configs:
      - targets: ['identity-service:3001']
    metrics_path: /metrics

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:3002']
    metrics_path: /metrics

  - job_name: 'organization-service'
    static_configs:
      - targets: ['organization-service:3003']
    metrics_path: /metrics

  - job_name: 'workspace-service'
    static_configs:
      - targets: ['workspace-service:3004']
    metrics_path: /metrics

  - job_name: 'team-service'
    static_configs:
      - targets: ['team-service:3005']
    metrics_path: /metrics

  - job_name: 'project-service'
    static_configs:
      - targets: ['project-service:3006']
    metrics_path: /metrics

  - job_name: 'sprint-service'
    static_configs:
      - targets: ['sprint-service:3007']
    metrics_path: /metrics

  - job_name: 'board-service'
    static_configs:
      - targets: ['board-service:3008']
    metrics_path: /metrics

  - job_name: 'task-service'
    static_configs:
      - targets: ['task-service:3009']
    metrics_path: /metrics

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3010']
    metrics_path: /metrics

  - job_name: 'comment-service'
    static_configs:
      - targets: ['comment-service:3011']
