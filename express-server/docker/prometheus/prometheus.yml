  - job_name: 'document-service'
    static_configs:
      - targets: ['document-service:3012']
    metrics_path: /metrics

  - job_name: 'search-service'
    static_configs:
      - targets: ['search-service:3013']
    metrics_path: /metrics

  - job_name: 'file-service'
    static_configs:
      - targets: ['file-service:3014']
    metrics_path: /metrics

  - job_name: 'report-service'
    static_configs:
