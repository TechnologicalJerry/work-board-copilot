version: '3.9'

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - boardpilot
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  # ============================================================
  # Infrastructure
  # ============================================================

  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: boardpilot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boardpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boardpilot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-boardpilot}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boardpilot}"]

  mongodb:
    <<: *service-defaults
    image: mongo:7-jammy
    container_name: boardpilot-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-boardpilot}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-boardpilot_secret}
      MONGO_INITDB_DATABASE: boardpilot
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init:/docker-entrypoint-initdb.d
    ports:
      - "27017:27017"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    container_name: boardpilot-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-boardpilot_redis_secret} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-boardpilot_redis_secret}", "ping"]

  elasticsearch:
    <<: *service-defaults
    image: elasticsearch:8.12.0
    container_name: boardpilot-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:-boardpilot_elastic_secret}
      - xpack.security.enabled=true
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTICSEARCH_PASSWORD:-boardpilot_elastic_secret} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
    ulimits:
      memlock:
        soft: -1
        hard: -1

  rabbitmq:
    <<: *service-defaults
    image: rabbitmq:3.12-management-alpine
    container_name: boardpilot-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-boardpilot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-boardpilot_secret}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]

  # ============================================================
  # Monitoring
  # ============================================================

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v2.49.1
    container_name: boardpilot-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    <<: *service-defaults
    image: grafana/grafana:10.3.1
    container_name: boardpilot-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3100:3000"
    depends_on:
      - prometheus

  jaeger:
    <<: *service-defaults
    image: jaegertracing/all-in-one:1.54
    container_name: boardpilot-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  # ============================================================
  # Services
  # ============================================================

  api-gateway:
    <<: *service-defaults
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
      target: production
    container_name: boardpilot-api-gateway
    env_file: ./services/api-gateway/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      SERVICE_NAME: api-gateway
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]

  identity-service:
    <<: *service-defaults
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
      target: production
    container_name: boardpilot-identity-service
