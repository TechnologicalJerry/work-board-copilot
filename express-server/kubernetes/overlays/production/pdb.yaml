---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: identity-service-pdb
  namespace: boardpilot
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: identity-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: task-service-pdb
  namespace: boardpilot
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: task-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: boardpilot
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
