apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boardpilot-staging

resources:
  - ../../base

namePrefix: staging-

commonLabels:
  environment: staging

patches:
  - target:
      kind: Deployment
      name: task-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: identity-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 5

configMapGenerator:
  - name: boardpilot-config
    behavior: merge
    literals:
      - NODE_ENV=staging
      - LOG_LEVEL=info
      - ALLOWED_ORIGINS=https://staging.boardpilot.ai

images:
  - name: ghcr.io/boardpilot/api-gateway
    newTag: staging
  - name: ghcr.io/boardpilot/identity-service
    newTag: staging
  - name: ghcr.io/boardpilot/task-service
    newTag: staging
