# NOTE: This is a TEMPLATE — never commit real secrets.
# Use sealed-secrets, external-secrets-operator, or Vault in production.
# Replace all <base64-encoded-...> placeholders with actual values.
apiVersion: v1
kind: Secret
metadata:
  name: boardpilot-secrets
  namespace: boardpilot
  annotations:
    # Use external-secrets-operator or sealed-secrets in production
    kubectl.kubernetes.io/last-applied-configuration: "TEMPLATE - NOT FOR PRODUCTION"
type: Opaque
data:
  # JWT
  JWT_ACCESS_SECRET: <base64-encoded-jwt-access-secret>
  JWT_REFRESH_SECRET: <base64-encoded-jwt-refresh-secret>
  ENCRYPTION_KEY: <base64-encoded-32-char-encryption-key>

  # Per-service database URLs
  IDENTITY_DATABASE_URL: <base64-encoded-postgres-url>
  USER_DATABASE_URL: <base64-encoded-postgres-url>
  ORGANIZATION_DATABASE_URL: <base64-encoded-postgres-url>
  WORKSPACE_DATABASE_URL: <base64-encoded-postgres-url>
  TEAM_DATABASE_URL: <base64-encoded-postgres-url>
  PROJECT_DATABASE_URL: <base64-encoded-postgres-url>
  SPRINT_DATABASE_URL: <base64-encoded-postgres-url>
  BOARD_DATABASE_URL: <base64-encoded-postgres-url>
  TASK_DATABASE_URL: <base64-encoded-postgres-url>
  FILE_DATABASE_URL: <base64-encoded-postgres-url>
  REPORT_DATABASE_URL: <base64-encoded-postgres-url>
  TIME_TRACKING_DATABASE_URL: <base64-encoded-postgres-url>
  BILLING_DATABASE_URL: <base64-encoded-postgres-url>
  NOTIFICATION_DATABASE_URL: <base64-encoded-postgres-url>
  AUTOMATION_DATABASE_URL: <base64-encoded-postgres-url>

  # MongoDB
  MONGODB_URI: <base64-encoded-mongodb-uri>

  # Redis
  REDIS_PASSWORD: <base64-encoded-redis-password>

  # RabbitMQ
  RABBITMQ_PASSWORD: <base64-encoded-rabbitmq-password>

  # Elasticsearch
  ELASTICSEARCH_PASSWORD: <base64-encoded-elasticsearch-password>

  # AWS
  AWS_ACCESS_KEY_ID: <base64-encoded-aws-access-key>
  AWS_SECRET_ACCESS_KEY: <base64-encoded-aws-secret-key>
  AWS_S3_BUCKET: <base64-encoded-bucket-name>

  # OAuth
  GOOGLE_CLIENT_ID: <base64-encoded-google-client-id>
  GOOGLE_CLIENT_SECRET: <base64-encoded-google-client-secret>
  GITHUB_CLIENT_ID: <base64-encoded-github-client-id>
  GITHUB_CLIENT_SECRET: <base64-encoded-github-client-secret>
  MICROSOFT_CLIENT_ID: <base64-encoded-microsoft-client-id>
  MICROSOFT_CLIENT_SECRET: <base64-encoded-microsoft-client-secret>

  # Email
  SMTP_HOST: <base64-encoded-smtp-host>
  SMTP_PORT: <base64-encoded-smtp-port>
  SMTP_USER: <base64-encoded-smtp-user>
  SMTP_PASSWORD: <base64-encoded-smtp-password>
  EMAIL_FROM: <base64-encoded-from-email>

  # OpenAI
  OPENAI_API_KEY: <base64-encoded-openai-key>

  # Stripe
  STRIPE_SECRET_KEY: <base64-encoded-stripe-secret>
  STRIPE_WEBHOOK_SECRET: <base64-encoded-stripe-webhook-secret>
  STRIPE_PUBLISHABLE_KEY: <base64-encoded-stripe-publishable-key>

  # Twilio
  TWILIO_ACCOUNT_SID: <base64-encoded-twilio-sid>
  TWILIO_AUTH_TOKEN: <base64-encoded-twilio-token>
  TWILIO_PHONE_NUMBER: <base64-encoded-twilio-phone>
