---
# Identity Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: boardpilot
  labels:
    app: identity-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: identity-service
          image: ghcr.io/boardpilot/identity-service:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: boardpilot-config
            - secretRef:
                name: boardpilot-secrets
          env:
            - name: PORT
              value: "3001"
            - name: SERVICE_NAME
              value: "identity-service"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: boardpilot-secrets
                  key: IDENTITY_DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: boardpilot
spec:
  selector:
    app: identity-service
  ports:
    - port: 3001
      targetPort: 3001
---
# Task Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: boardpilot
  labels:
    app: task-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: task-service
          image: ghcr.io/boardpilot/task-service:latest
          ports:
            - containerPort: 3009
          envFrom:
            - configMapRef:
                name: boardpilot-config
            - secretRef:
                name: boardpilot-secrets
          env:
            - name: PORT
              value: "3009"
            - name: SERVICE_NAME
              value: "task-service"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: boardpilot-secrets
                  key: TASK_DATABASE_URL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 3009
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3009
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: boardpilot
spec:
  selector:
    app: task-service
  ports:
    - port: 3009
      targetPort: 3009
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: task-service-hpa
  namespace: boardpilot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: task-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
